[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-reliability-platform"
version = "0.1.0"
description = "Autonomous platform for AI Application Reliability, Telemetry, and Predictive QA"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0.1",
    "mcp>=2.2.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["*TestSuite", "*Tests"]
